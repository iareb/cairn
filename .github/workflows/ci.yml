name: CI

on:
  push:
  pull_request:
  workflow_dispatch:      # permette di avviarlo a mano dalla scheda Actions

# Il workflow legge solo il codice: niente permessi di scrittura sul repo
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        preset: [debug, asan]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
